name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CELETIS_FLOW_SKIP_BOARD_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - run: for t in tests/*.test.sh; do echo "== $t"; bash "$t"; done
      - run: scripts/capscore.sh --test
