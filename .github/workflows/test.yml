name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DISABLE_UPDATES: "1"
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install pinned verification tools
        run: bun --no-env-file --no-install --config=/dev/null --no-macros scripts/install-tools.ts "${{ runner.temp }}/celetis-tools" --claude
      - name: Verify gate
        run: bun --no-env-file --no-install --config=/dev/null --no-macros scripts/verify.ts
