name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CELETIS_FLOW_SKIP_BOARD_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Mike Farah yq v4.54.1
        run: |
          curl --fail --location --output "$RUNNER_TEMP/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yq" --version
      - run: perl -c scripts/plugin-update.pl
      - run: |
          set -euo pipefail
          for t in tests/*.test.sh; do
            echo "== $t"
            PATH="/bin:$PATH" /bin/bash "$t"
          done
      - run: scripts/capscore.sh --test
