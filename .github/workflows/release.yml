name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      DISABLE_UPDATES: "1"
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install engine dependencies
        run: bun --no-env-file --no-install --config=/dev/null --no-macros scripts/worktree-setup.ts "$GITHUB_WORKSPACE"
      - name: Install pinned verification tools
        run: bun --no-env-file --no-install --config=/dev/null --no-macros scripts/install-tools.ts "$RUNNER_TEMP/celetis-tools" --claude
      - name: Verify gate
        run: bun --no-env-file --no-install --config=/dev/null --no-macros scripts/verify.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install npm
        run: npm install -g npm@11.20.0
      - name: Publish
        shell: bash
        run: |
          bun --no-env-file --no-install --config=/dev/null --no-macros scripts/package.ts "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/celetis" | tee "$RUNNER_TEMP/package.log"
          case "$(tail -n 1 "$RUNNER_TEMP/package.log")" in
            "package: publish") npm publish "$RUNNER_TEMP/celetis/celetis-${GITHUB_REF_NAME#v}.tgz" --access public ;;
            "package: published") ;;
            *) exit 1 ;;
          esac
